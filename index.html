<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Área do aluno LowLab: formação prática em produtos low ticket, tráfego pago e vendas no orgânico." />
    <meta name="theme-color" content="#071510" />
    <script>
      try {
        if (localStorage.getItem("lowlab-theme") !== "light") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="assets/lowlab-symbol-ui.png" />
    <title>LowLab — Área do aluno</title>
    <link rel="preload" as="image" href="assets/university-campus-hero-v1.webp" type="image/webp" />
    <link rel="preload" as="image" href="assets/lowlab-symbol-ui.png" />
    <link rel="prefetch" as="image" href="assets/filters-library.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="assets/favorites-library.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="assets/formation-campus.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=Manrope:wght@400..800&family=Sora:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20261010" />
  </head>
  <body>
    <section class="auth-gate" id="authGate" aria-labelledby="authTitle">
      <div class="auth-atmosphere" aria-hidden="true"></div>
      <article class="auth-card">
        <header class="auth-brand">
          <img src="assets/lowlab-symbol-ui.png" alt="" decoding="async" />
          <span><strong>LOW<span>LAB</span></strong><small>Universidade digital</small></span>
        </header>
        <div class="auth-copy">
          <span class="auth-eyebrow">Campus reservado</span>
          <h1 id="authTitle">Acesse sua formação.</h1>
        </div>
        <form class="auth-form" id="loginForm">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required />
          <label for="loginPassword">Senha</label>
          <div class="auth-password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="8" required />
            <button type="button" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <button class="auth-submit" id="loginSubmit" type="submit">Entrar no campus</button>
        </form>
        <form class="auth-form auth-reset-form" id="resetForm" hidden>
          <label for="newPassword">Nova senha</label>
          <div class="auth-password-field">
            <input id="newPassword" name="new-password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" minlength="8" required />
          </div>
          <label for="confirmPassword">Confirme a nova senha</label>
          <div class="auth-password-field">
            <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repita sua senha" minlength="8" required />
          </div>
          <button class="auth-submit" id="resetSubmit" type="submit">Salvar nova senha</button>
        </form>
        <button class="auth-forgot" id="forgotPassword" type="button">Esqueci minha senha</button>
        <button class="auth-forgot" id="backToLogin" type="button" hidden>Voltar ao acesso</button>
        <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        <footer>Acesso individual e protegido.</footer>
      </article>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" aria-label="Navegação principal">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <a class="brand" href="#home" aria-label="LowLab, página inicial">
          <span class="brand-mark"><img src="assets/lowlab-symbol-ui.png" alt="" decoding="async" /></span>
          <span class="brand-copy"><strong>LOW<span>LAB</span></strong><small>Universidade digital</small></span>
        </a>

        <nav class="nav-list">
          <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>
            Meu campus
          </button>
          <button class="nav-item" data-view="plan">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-12 4h3m2 0h3m-8 3h3"/></svg>
            Plano 30 dias
          </button>
          <button class="nav-item" data-view="tracks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"/><circle cx="8" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></svg>
            Filtros
          </button>
          <button class="nav-item" data-view="favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
            Favoritos
          </button>
          <button class="nav-item" data-view="formation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="m8.5 12-1 9 4.5-2.5 4.5 2.5-1-9"/></svg>
            Formação
          </button>
          <button class="nav-item" id="adminNav" data-view="admin" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-2.5A4.5 4.5 0 0 1 8.5 13h7a4.5 4.5 0 0 1 4.5 4.5V20"/><circle cx="12" cy="7" r="4"/><path d="m17.5 9.5 1 1 2-2"/></svg>
            Administração
          </button>
        </nav>

        <div class="sidebar-card" aria-hidden="true">
          <span class="eyebrow">Seu semestre</span>
          <strong id="sidebarProgress">0% concluído</strong>
          <div class="progress-track"><span id="sidebarProgressBar"></span></div>
          <p>Consistência vence intensidade.</p>
        </div>

        <div class="header-tools">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <input id="globalSearch" type="search" placeholder="Busque uma aula" aria-label="Buscar aulas" autocomplete="off" />
            <kbd>⌘ K</kbd>
            <div class="search-results" id="searchResults" role="listbox"></div>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="Ativar versão clara" aria-pressed="true">
            <span class="theme-toggle-track" aria-hidden="true">
              <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
              <span class="theme-toggle-thumb"></span>
            </span>
          </button>
          <button class="profile-button" id="profileButton" data-view="profile" aria-label="Abrir perfil">
            <span class="profile-label">Perfil</span>
            <span class="avatar">ML</span>
          </button>
          <button class="logout-button" id="logoutButton" aria-label="Sair da LowLab">Sair</button>
        </div>
      </aside>

      <div class="main-column">
        <main id="app" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="lessonIconTemplate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5z"/></svg>
    </template>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="auth-config.js"></script>
    <script defer src="auth.js?v=20261010"></script>
  </body>
</html>
